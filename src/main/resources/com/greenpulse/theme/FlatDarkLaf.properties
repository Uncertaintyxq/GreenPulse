Button.foreground = $GP.ink
Button.disabledText = #6E7873
Button.default.background = $GP.accent
Button.default.foreground = #FFFFFF
Button.default.hoverBackground = $GP.accentHover
Button.default.pressedBackground = $GP.accentPressed
Button.default.borderColor = $GP.accent
Button.default.hoverBorderColor = $GP.accentHover
Button.default.focusedBorderColor = #FFFFFF
Button.toolbar.hoverBackground = $GP.surface2
Button.toolbar.pressedBackground = #252B28
TextField.background = #1C211F
PasswordField.background = #1C211F
FormattedTextField.background = #1C211F
Spinner.background = #1C211F
TextComponent.placeholderForeground = $GP.ink3
TextField.inactiveBackground = #131715
TextField.disabledBackground = #0E1110
