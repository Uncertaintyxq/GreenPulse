# GreenPulse database settings.
# Copy this file to greenpulse.properties (same folder) and change what differs on your computer.
# greenpulse.properties is ignored by git, so your password stays on your machine.
# Leave a line out to use its default.

mysql.host=localhost
mysql.port=3306
mysql.database=greenpulse_db
mysql.user=root
# XAMPP and a fresh Homebrew MySQL have no root password; MySQL Installer on Windows asks you to set one.
mysql.password=
