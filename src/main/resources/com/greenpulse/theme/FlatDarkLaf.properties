# GreenPulse dark theme: the same sheets in graphite.

@accentColor = #3DB57A
@background = #0E1110

# ---- GreenPulse tokens (read through Theme.color) ----
GP.ground = #0E1110
GP.surface = #161A18
GP.surface2 = #1C211F
GP.sidebar = #121614
GP.line = #2A302D
GP.line2 = #222825
GP.ink = #ECEFED
GP.ink2 = #B6BEB9
GP.ink3 = #929B96
GP.rowSelected = #1B3326
GP.shadowNear = #00000033
GP.shadowFar = #0000001F

GP.accent = #187A4D
GP.accentHover = #146B43
GP.accentPressed = #105A38
GP.accentInk = #FFFFFF
GP.accentSoft = #15291F
GP.accentText = #86D6AA

GP.critical = #E2533C
GP.criticalInk = #121815
GP.criticalText = #FF8F7C
GP.criticalSoft = #3A1D19
GP.warning = #E9A20F
GP.warningInk = #121815
GP.warningText = #F2C55C
GP.warningBar = #D9A21A
GP.warningSoft = #332C17
GP.ok = #3DB57A
GP.okText = #86D6AA
GP.okSoft = #15291F

GP.recycling = #7DA9F2
GP.compost = #D69C68
GP.fleet = #B6BEB9

# ---- FlatLaf components ----
