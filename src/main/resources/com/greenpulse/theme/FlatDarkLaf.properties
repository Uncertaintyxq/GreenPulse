Slider.trackValueColor = #3FA674
Slider.thumbColor = #3FA674
Slider.trackColor = #34433A
ScrollBar.track = $GP.ground
ScrollBar.thumb = #34433A
ScrollBar.hoverThumbColor = #45564C
ToolTip.background = #E6EDE8
ToolTip.foreground = #0F1512
SplitPane.background = $GP.ground
SplitPaneDivider.draggingColor = #3FA674
