# GreenPulse light theme: clean white sheets on a soft ground. This is the default.

@accentColor = #0E6E46
@background = #F5F7F6

# ---- GreenPulse tokens (read through Theme.color) ----
# One neutral ramp, a breath of green in the greys.
GP.ground = #F5F7F6
GP.surface = #FFFFFF
GP.surface2 = #F2F5F3
GP.sidebar = #FFFFFF
GP.line = #E2E7E4
GP.line2 = #EDF1EE
GP.ink = #121815
GP.ink2 = #454F4A
GP.ink3 = #5F6964
GP.rowSelected = #EAF4EE
# The soft two-step shadow under each sheet (near, then far).
GP.shadowNear = #1018140F
GP.shadowFar = #10181408

# The one accent: primary action, current page, selection.
GP.accent = #0E6E46
GP.accentHover = #0B5E3B
GP.accentPressed = #094F32
GP.accentInk = #FFFFFF
GP.accentSoft = #E6F2EB
GP.accentText = #0A6340

# States. Colour appears only where a bin needs someone.
GP.critical = #C8321C
GP.criticalInk = #FFFFFF
GP.criticalText = #B42318
GP.criticalSoft = #FCEDEA
GP.warning = #E9A20F
GP.warningInk = #121815
GP.warningText = #875300
GP.warningBar = #B07A06
GP.warningSoft = #FDF3DE
GP.ok = #1D8A55
GP.okText = #0A6340
GP.okSoft = #E6F2EB

# Data series.
GP.recycling = #2F68D0
GP.compost = #97602E
GP.fleet = #454F4A

# ---- FlatLaf components ----
Panel.background = $GP.ground
Component.borderColor = #848D88
Component.disabledBorderColor = #E2E7E4
Component.focusColor = #0E6E4638
Component.focusedBorderColor = #0E6E46
Button.background = #FFFFFF
Button.borderColor = #CFD6D2
Button.hoverBorderColor = #A7B0AB
Button.hoverBackground = #F7F9F8
Button.pressedBackground = #EEF2EF
Button.focusedBorderColor = #0E6E46
Button.foreground = $GP.ink
Button.disabledText = #8E9792
Button.default.background = $GP.accent
Button.default.foreground = #FFFFFF
Button.default.hoverBackground = $GP.accentHover
Button.default.pressedBackground = $GP.accentPressed
Button.default.borderColor = $GP.accent
Button.default.hoverBorderColor = $GP.accentHover
Button.default.focusedBorderColor = #FFFFFF
Button.toolbar.hoverBackground = $GP.surface2
Button.toolbar.pressedBackground = #E8EDEA
TextField.background = #FFFFFF
PasswordField.background = #FFFFFF
FormattedTextField.background = #FFFFFF
Spinner.background = #FFFFFF
TextComponent.placeholderForeground = $GP.ink3
TextField.inactiveBackground = $GP.surface2
TextField.disabledBackground = #EEF1EF
TextField.inactiveForeground = #6B7570
ComboBox.background = #FFFFFF
ComboBox.buttonBackground = #FFFFFF
ComboBox.selectionBackground = $GP.rowSelected
ComboBox.selectionForeground = $GP.ink
List.selectionBackground = $GP.rowSelected
List.selectionForeground = $GP.ink
Table.background = $GP.surface
Table.foreground = $GP.ink
Table.gridColor = $GP.line2
Table.selectionBackground = $GP.rowSelected
Table.selectionForeground = $GP.ink
Table.selectionInactiveBackground = #F0F6F2
Table.selectionInactiveForeground = $GP.ink
TableHeader.background = $GP.surface
TableHeader.foreground = $GP.ink3
TableHeader.separatorColor = $GP.surface
TableHeader.bottomSeparatorColor = $GP.line
ProgressBar.foreground = $GP.accent
ProgressBar.background = #E7ECE9
ProgressBar.selectionForeground = #FFFFFF
ProgressBar.selectionBackground = $GP.ink
Slider.trackValueColor = $GP.accent
Slider.thumbColor = $GP.accent
Slider.trackColor = #DCE2DE
CheckBox.icon.checkmarkColor = #FFFFFF
ScrollBar.track = #00000000
ScrollBar.thumb = #CDD4D0
ScrollBar.hoverThumbColor = #AEB7B2
ScrollBar.pressedThumbColor = #98A29C
ToolTip.background = $GP.ink
ToolTip.foreground = #FFFFFF
Separator.foreground = $GP.line
SplitPane.background = $GP.ground
SplitPaneDivider.draggingColor = $GP.accent
OptionPane.background = $GP.surface
