# GreenPulse light theme: road guide sign by day.

@accentColor = #0B5137
@background = #F3F5F1

# ---- GreenPulse tokens (read through Theme.color) ----
# One tonal ramp for every neutral, tinted toward sign green.
GP.ground = #F3F5F1
GP.surface = #FFFFFF
GP.surface2 = #F7F8F6
GP.line = #D5DCD6
GP.line2 = #EAEEEA
GP.ink = #17231C
GP.ink2 = #43534A
GP.ink3 = #5D6B63
GP.lattice = #0B51370B

# The sign panel (rail, gantry, login): stays green in both themes.
GP.sign = #0B5137
GP.signDeep = #08402B
GP.signHover = #11613F
GP.signInk = #FFFFFF
GP.signInk2 = #CFE3D6
GP.signLatticeStrong = #FFFFFF1C
GP.signLattice = #FFFFFF0E

# Sign classes as states.
GP.critical = #B42318
GP.criticalInk = #FFFFFF
GP.criticalText = #A3201A
GP.criticalSoft = #FBE9E7
GP.warning = #F2B705
GP.warningInk = #17231C
GP.warningText = #8A5A00
GP.warningBar = #A87A00
GP.warningSoft = #FDF3D3
GP.ok = #0B5137
GP.okText = #0B5137
GP.okSoft = #E3EEE7

# Data series: service blue and tourist brown signs.
GP.recycling = #1F4E8C
GP.compost = #7A4E24
GP.fleet = #43534A

# ---- FlatLaf components ----
Panel.background = $GP.ground
Component.borderColor = #828D86
Component.disabledBorderColor = #DCE2DD
Component.focusColor = #0B513766
Component.focusedBorderColor = #0B5137
Button.background = #FFFFFF
Button.borderColor = #828D86
Button.hoverBorderColor = #0B5137
Button.foreground = $GP.ink
Button.default.background = $GP.sign
Button.default.foreground = #FFFFFF
Button.default.hoverBackground = $GP.signHover
Button.default.borderColor = $GP.sign
Button.default.hoverBorderColor = $GP.signHover
Button.default.focusedBorderColor = #FFFFFF
TextField.background = #FFFFFF
PasswordField.background = #FFFFFF
TextComponent.placeholderForeground = $GP.ink3
TextField.inactiveBackground = $GP.surface2
TextField.disabledBackground = #EEF1ED
TextField.inactiveForeground = #75817A
ComboBox.background = #FFFFFF
ComboBox.buttonBackground = #FFFFFF
Table.background = $GP.surface
Table.foreground = $GP.ink
Table.gridColor = $GP.line2
Table.selectionBackground = #DCEBE1
Table.selectionForeground = $GP.ink
Table.selectionInactiveBackground = #E7F0EA
Table.selectionInactiveForeground = $GP.ink
TableHeader.background = $GP.surface2
TableHeader.foreground = $GP.ink2
TableHeader.separatorColor = $GP.surface2
TableHeader.bottomSeparatorColor = $GP.line
ProgressBar.foreground = $GP.sign
ProgressBar.background = #E6EBE7
ProgressBar.selectionForeground = #FFFFFF
ProgressBar.selectionBackground = $GP.ink
Slider.trackValueColor = $GP.sign
Slider.thumbColor = $GP.sign
Slider.trackColor = #D5DCD6
ScrollBar.track = $GP.ground
ScrollBar.thumb = #C3CCC5
ScrollBar.hoverThumbColor = #A9B4AC
ToolTip.background = $GP.ink
ToolTip.foreground = #FFFFFF
SplitPane.background = $GP.ground
SplitPaneDivider.draggingColor = $GP.sign
