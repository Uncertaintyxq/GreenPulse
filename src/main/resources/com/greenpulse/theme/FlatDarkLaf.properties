# GreenPulse dark theme: the same guide sign at night.

@accentColor = #3FA674
@background = #0F1512

# ---- GreenPulse tokens (read through Theme.color) ----
GP.ground = #0F1512
GP.surface = #161E19
GP.surface2 = #1B2520
GP.line = #2E3B34
GP.line2 = #222D27
GP.ink = #E6EDE8
GP.ink2 = #B3C2B8
GP.ink3 = #8FA196
GP.lattice = #FFFFFF06

GP.sign = #0B5137
GP.signDeep = #083A27
GP.signHover = #11613F
GP.signInk = #FFFFFF
GP.signInk2 = #CFE3D6
GP.signLatticeStrong = #FFFFFF18
GP.signLattice = #FFFFFF0C

GP.critical = #C42B1F
GP.criticalInk = #FFFFFF
GP.criticalText = #FF8A7A
GP.criticalSoft = #3A1C19
GP.warning = #F2B705
GP.warningInk = #17231C
GP.warningText = #F2C744
GP.warningBar = #D9A406
GP.warningSoft = #3A3014
GP.ok = #3FA674
GP.okText = #8ED7AE
GP.okSoft = #1C3527

GP.recycling = #7FA9E6
GP.compost = #D29A68
GP.fleet = #B3C2B8

# ---- FlatLaf components ----
Panel.background = $GP.ground
Component.borderColor = #5F7066
Component.disabledBorderColor = #26312B
Component.focusColor = #3FA67466
Component.focusedBorderColor = #3FA674
Button.background = #1B2520
Button.borderColor = #5F7066
Button.hoverBorderColor = #3FA674
Button.foreground = $GP.ink
Button.default.background = #17704A
Button.default.foreground = #FFFFFF
Button.default.hoverBackground = #1C8457
Button.default.borderColor = #17704A
Button.default.hoverBorderColor = #1C8457
Button.default.focusedBorderColor = #FFFFFF
TextField.background = #1B2520
PasswordField.background = #1B2520
TextComponent.placeholderForeground = $GP.ink3
TextField.inactiveBackground = #121915
TextField.disabledBackground = #0F1512
TextField.inactiveForeground = #6F8076
ComboBox.background = #1B2520
ComboBox.buttonBackground = #1B2520
Table.background = $GP.surface
Table.foreground = $GP.ink
Table.gridColor = $GP.line2
Table.selectionBackground = #1F3A2B
Table.selectionForeground = $GP.ink
Table.selectionInactiveBackground = #1C3026
Table.selectionInactiveForeground = $GP.ink
TableHeader.background = $GP.surface2
TableHeader.foreground = $GP.ink2
TableHeader.separatorColor = $GP.surface2
TableHeader.bottomSeparatorColor = $GP.line
ProgressBar.foreground = #3FA674
ProgressBar.background = #26312B
ProgressBar.selectionForeground = #0F1512
